services:
  web:
    build: .
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000
    env_file: [.env]
    depends_on: [db, redis]
    restart: unless-stopped
    volumes:
      - static_data:/app/staticfiles
    labels:
      - traefik.enable=true
      - traefik.http.routers.totinda-api.rule=Host(`backend.totinda.com`)
      - traefik.http.routers.totinda-api.entrypoints=websecure
      - traefik.http.routers.totinda-api.tls.certresolver=myresolver
      - traefik.http.services.totinda-api.loadbalancer.server.port=8000
      - traefik.http.routers.totinda-api-http.rule=Host(`backend.totinda.com`)
      - traefik.http.routers.totinda-api-http.entrypoints=web
      - traefik.http.routers.totinda-api-http.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.docker.network=totinda_proxy
    networks: [internal, proxy]

  db:
    image: mysql:8.1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [internal]

  celery_worker:
    build: .
    command: celery -A project worker --loglevel=info
    env_file: [.env]
    depends_on: [redis, db]
    restart: unless-stopped
    networks: [internal]

  celery_beat:
    build: .
    command: celery -A project beat --loglevel=info
    env_file: [.env]
    depends_on: [redis, db]
    restart: unless-stopped
    networks: [internal]

  phpmyadmin:
    image: phpmyadmin:latest
    profiles: [tools]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - 127.0.0.1:8888:80
    depends_on: [db]
    networks: [internal]

  flower:
    image: mher/flower:2.0
    profiles: [tools]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH}
    ports:
      - 127.0.0.1:5555:5555
    depends_on: [redis, celery_worker]
    networks: [internal]

  traefik:
    image: traefik:v2.11
    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=totinda_proxy
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.myresolver.acme.httpchallenge=true
      - --certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    restart: unless-stopped
    networks: [proxy]

volumes:
  mysql_data:
  redis_data:
  static_data:

networks:
  internal:
  proxy:
    name: totinda_proxy
